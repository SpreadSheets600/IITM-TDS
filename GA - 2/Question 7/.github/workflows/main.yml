name: Cache Dependencies for Q7

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache dependencies
              id: cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/my-deps
                  key: cache-a5f06c0

            - name: prime-cache-a5f06c0
              run: |
                  echo "cache hit? ${{ steps.cache.outputs.cache-hit }}"
