  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    window.onload = function () {
      init3DScene();
    };

    function init3DScene() {
      const config = {
        colorBg: '#050505',
        colorGeometry: '#111111',
        colorWireframe: '#00ffcc',
        colorLight1: '#ff0066',
        colorLight2: '#00ffcc',
        colorParticles: '#ffffff'
      };

      const state = {
        mouseX: 0,
        mouseY: 0,
        targetX: 0,
        targetY: 0,
        windowHalfX: window.innerWidth / 2,
        windowHalfY: window.innerHeight / 2
      };

      const canvas = document.getElementById('webgl-canvas');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(config.colorBg);
      scene.fog = new THREE.FogExp2(config.colorBg, 0.03);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const group = new THREE.Group();
      scene.add(group);

      const geoSize = window.innerWidth < 768 ? 1.5 : 2.2;
      const geometry = new THREE.IcosahedronGeometry(geoSize, 1);

      const material = new THREE.MeshPhysicalMaterial({
        color: config.colorGeometry,
        metalness: 0.8,
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        flatShading: true
      });
      const coreMesh = new THREE.Mesh(geometry, material);
      group.add(coreMesh);

      const wireframeGeo = new THREE.IcosahedronGeometry(geoSize * 1.05, 1);
      const wireframeMat = new THREE.MeshBasicMaterial({
        color: config.colorWireframe,
        wireframe: true,
        transparent: true,
        opacity: 0.15
      });
      const wireframeMesh = new THREE.Mesh(wireframeGeo, wireframeMat);
      group.add(wireframeMesh);

      const innerWireframeGeo = new THREE.IcosahedronGeometry(geoSize * 0.8, 0);
      const innerWireframeMat = new THREE.MeshBasicMaterial({
        color: config.colorLight1,
        wireframe: true,
        transparent: true,
        opacity: 0.3
      });
      const innerWireframeMesh = new THREE.Mesh(innerWireframeGeo, innerWireframeMat);
      group.add(innerWireframeMesh);

      group.position.x = window.innerWidth > 768 ? 2 : 0;

      const particlesGeometry = new THREE.BufferGeometry();
      const particlesCount = window.innerWidth < 768 ? 500 : 1500;
      const posArray = new Float32Array(particlesCount * 3);
      const scaleArray = new Float32Array(particlesCount);

      for (let i = 0; i < particlesCount; i++) {
        const r = 5 + Math.random() * 15;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        posArray[(i * 3) + 1] = r * Math.sin(phi) * Math.sin(theta);
        posArray[(i * 3) + 2] = r * Math.cos(phi);
        scaleArray[i] = Math.random();
      }

      particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      particlesGeometry.setAttribute('aScale', new THREE.BufferAttribute(scaleArray, 1));

      const particlesMaterial = new THREE.PointsMaterial({
        size: 0.05,
        color: config.colorParticles,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
      });

      const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
      scene.add(particlesMesh);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambientLight);

      const pointLight1 = new THREE.PointLight(config.colorLight1, 3, 20);
      pointLight1.position.set(5, 5, 5);
      scene.add(pointLight1);

      const pointLight2 = new THREE.PointLight(config.colorLight2, 3, 20);
      pointLight2.position.set(-5, -5, 2);
      scene.add(pointLight2);

      const pointLight3 = new THREE.PointLight(0xffffff, 1, 10);
      pointLight3.position.set(0, 0, 5);
      scene.add(pointLight3);

      document.addEventListener('mousemove', onDocumentMouseMove, false);
      document.addEventListener('touchmove', onDocumentTouchMove, { passive: true });
      window.addEventListener('resize', onWindowResize, false);

      function onDocumentMouseMove(event) {
        state.mouseX = event.clientX - state.windowHalfX;
        state.mouseY = event.clientY - state.windowHalfY;
      }

      function onDocumentTouchMove(event) {
        if (event.touches.length === 1) {
          state.mouseX = event.touches[0].pageX - state.windowHalfX;
          state.mouseY = event.touches[0].pageY - state.windowHalfY;
        }
      }

      function onWindowResize() {
        state.windowHalfX = window.innerWidth / 2;
        state.windowHalfY = window.innerHeight / 2;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        group.position.x = window.innerWidth > 768 ? 2 : 0;
      }

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();
        state.targetX = state.mouseX * 0.001;
        state.targetY = state.mouseY * 0.001;
        group.rotation.y += 0.05 * (state.targetX - group.rotation.y);
        group.rotation.x += 0.05 * (state.targetY - group.rotation.x);
        coreMesh.rotation.y += 0.002;
        coreMesh.rotation.x += 0.001;
        wireframeMesh.rotation.y -= 0.001;
        wireframeMesh.rotation.z += 0.002;
        innerWireframeMesh.rotation.x -= 0.003;
        innerWireframeMesh.rotation.y += 0.002;
        group.position.y = Math.sin(elapsedTime * 0.5) * 0.2;
        particlesMesh.rotation.y = elapsedTime * 0.02;
        particlesMesh.rotation.x = Math.sin(elapsedTime * 0.05) * 0.1;
        pointLight1.position.x = Math.sin(elapsedTime * 0.5) * 6;
        pointLight1.position.z = Math.cos(elapsedTime * 0.5) * 6;
        pointLight2.position.x = -Math.sin(elapsedTime * 0.3) * 6;
        pointLight2.position.z = -Math.cos(elapsedTime * 0.3) * 6;
        renderer.render(scene, camera);
      }

      animate();
      group.scale.set(0.01, 0.01, 0.01);
      let introFrames = 0;

      function introAnimate() {
        if (introFrames < 60) {
          group.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
          introFrames++;
          requestAnimationFrame(introAnimate);
        }
      }

      introAnimate();
    }
  </script>
